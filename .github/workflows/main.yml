name: Zola

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      
    - name: Build and deploy
      uses: shalzz/zola-deploy-action@v0.22.1
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
